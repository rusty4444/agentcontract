[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcontract"
version = "0.0.3"
description = "JSON-native agent capability contracts and a pre-execution gate for any LLM runtime"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Rusty4444" }]
keywords = [
    "ai-agent",
    "llm",
    "governance",
    "policy",
    "security",
    "contracts",
    "guardrails",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.13.4",
    "click>=8.5.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
agc = "agentcontract.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["agentcontract"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
